name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: threed-rs
            asset_name: threed-rs-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: threed-rs.exe
            asset_name: threed-rs-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: threed-rs
            asset_name: threed-rs-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: threed-rs
            asset_name: threed-rs-macos-x86_64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p threed-rs-cli

      - name: Package Binary (Linux / macOS)
        if: matrix.os == 'ubuntu-latest' || startsWith(matrix.os, 'macos')
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}
          cd ../../..

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}
          cd ../../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            threed-rs-linux-x86_64.tar.gz/threed-rs-linux-x86_64.tar.gz
            threed-rs-windows-x86_64.zip/threed-rs-windows-x86_64.zip
            threed-rs-macos-arm64.tar.gz/threed-rs-macos-arm64.tar.gz
            threed-rs-macos-x86_64.tar.gz/threed-rs-macos-x86_64.tar.gz
          generate_release_notes: true
